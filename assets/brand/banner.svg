<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="铁板神数软件 · Tieban Shenshu Community Edition">
  <title>铁板神数软件 · Tieban Shenshu Community Edition</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="45%" stop-color="#F6F1E4"/>
      <stop offset="100%" stop-color="#EFE8D8"/>
    </linearGradient>
    <pattern id="fibre" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 L7 0" stroke="#000" stroke-opacity="0.016" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8894E"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#A8894E"/>
    </linearGradient>
  </defs>

  <!-- 宣纸底 -->
  <rect width="1200" height="320" fill="url(#paper)"/>
  <rect width="1200" height="320" fill="url(#fibre)"/>

  <!-- 宋版双框（书口） -->
  <rect x="22" y="22" width="1156" height="276" fill="none" stroke="#1B1B1B" stroke-width="3"/>
  <rect x="32" y="32" width="1136" height="256" fill="none" stroke="#1B1B1B" stroke-opacity="0.42" stroke-width="1"/>

  <!-- 左侧竖栏（版心） -->
  <line x1="150" y1="52" x2="150" y2="268" stroke="#1B1B1B" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="170" y1="52" x2="170" y2="268" stroke="#1B1B1B" stroke-opacity="0.28" stroke-width="1"/>

  <!-- 左栏竖排品牌 -->
  <g font-family="'Songti SC','SimSun','Noto Serif SC','Source Han Serif SC',serif" fill="#8C2B22" text-anchor="middle">
    <text x="93" y="100" font-size="27" letter-spacing="2">铁板</text>
    <text x="93" y="140" font-size="27" letter-spacing="2">神数</text>
    <text x="93" y="180" font-size="27" letter-spacing="2">软件</text>
  </g>
  <text x="93" y="232" font-family="'Songti SC','SimSun',serif" font-size="13" fill="#5B5B5B" text-anchor="middle" letter-spacing="1">公開學術版</text>

  <!-- 主标题 -->
  <text x="222" y="118" font-family="'Songti SC','SimSun','Noto Serif SC','Source Han Serif SC',serif"
        font-size="58" font-weight="700" fill="#141414" letter-spacing="4">铁板神数软件</text>

  <!-- 英文副题（衬线 + 宽字距） -->
  <text x="225" y="160" font-family="Georgia,'Times New Roman',serif"
        font-size="19" fill="#A8894E" letter-spacing="6.5">TIEBAN SHENSHU</text>

  <!-- 铜金分隔 -->
  <line x1="225" y1="182" x2="620" y2="182" stroke="url(#gold)" stroke-width="1.6"/>

  <!-- 中英说明 -->
  <text x="225" y="212" font-family="'Songti SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="16" fill="#3A3A3A" letter-spacing="1.2">传统文化研究 · 文献索引 · 可运行教学工具</text>
  <text x="225" y="238" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="12.5" fill="#6B6B6B" letter-spacing="1.4">COMMUNITY RESEARCH &amp; EDUCATIONAL DEMOS</text>

  <!-- 底部提示：私有边界 -->
  <text x="225" y="268" font-family="'Songti SC','PingFang SC',sans-serif"
        font-size="12" fill="#8A8A8A" letter-spacing="0.8">商业核心与完整条文库不在此公开 · Private core is not part of this repository</text>

  <!-- 朱砂印章 -->
  <g transform="translate(1048,96)">
    <rect x="0" y="0" width="96" height="96" rx="4" fill="#9D2933"/>
    <rect x="6" y="6" width="84" height="84" rx="2" fill="none" stroke="#FBF7EE" stroke-opacity="0.55" stroke-width="2"/>
    <text x="48" y="42" font-family="'Songti SC','SimSun',serif" font-size="30" fill="#FBF7EE"
          text-anchor="middle" font-weight="700" letter-spacing="2">天命</text>
    <text x="48" y="78" font-family="'Songti SC','SimSun',serif" font-size="30" fill="#FBF7EE"
          text-anchor="middle" font-weight="700" letter-spacing="2">鐵板</text>
  </g>

  <!-- 右下角细注 -->
  <text x="1096" y="232" font-family="Georgia,serif" font-size="10.5" fill="#9A9A9A"
        text-anchor="middle" letter-spacing="1.6">EST. 2026</text>
</svg>