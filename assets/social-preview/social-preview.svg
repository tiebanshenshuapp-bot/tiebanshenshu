  <!-- 四语标识 -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8A8A8A" letter-spacing="1.2">
    <text x="414" y="430">简体中文</text>
    <text x="500" y="430" fill="#C0B9AA">·</text>
    <text x="520" y="430">繁體中文 (HK)</text>
    <text x="650" y="430" fill="#C0B9AA">·</text>
    <text x="670" y="430">正體中文 (TW)</text>
    <text x="800" y="430" fill="#C0B9AA">·</text>
    <text x="820" y="430">English</text>
  </g>

  <!-- 官网 -->
