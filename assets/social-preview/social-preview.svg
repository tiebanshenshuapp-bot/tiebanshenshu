  <!-- 四角装饰 -->
  <g stroke="#1B1B1B" stroke-width="3" fill="none" opacity="0.5">
    <path d="M72 116 L72 72 L116 72"/>
    <path d="M1164 72 L1208 72 L1208 116"/>
    <path d="M1208 524 L1208 568 L1164 568"/>
    <path d="M116 568 L72 568 L72 524"/>
  </g>
