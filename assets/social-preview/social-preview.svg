  <!-- 左上角页码式装饰 -->
  <text x="96" y="118" font-family="Georgia,serif" font-size="12" fill="#B5AC98" letter-spacing="3">卷首 · VOL. I</text>

  <!-- 印章 -->
  <g transform="translate(1064,300)">
    <rect x="0" y="0" width="128" height="128" rx="5" fill="#9D2933"/>
    <rect x="8" y="8" width="112" height="112" rx="3" fill="none" stroke="#FCF9F2" stroke-opacity="0.6" stroke-width="2.5"/>
    <text x="64" y="56" font-family="'Songti SC','SimSun',serif" font-size="40" fill="#FCF9F2"
          text-anchor="middle" font-weight="700" letter-spacing="2">天命</text>
    <text x="64" y="104" font-family="'Songti SC','SimSun',serif" font-size="40" fill="#FCF9F2"
          text-anchor="middle" font-weight="700" letter-spacing="2">鐵板</text>
  </g>

  <!-- 右下角细注 -->
  <text x="1128" y="470" font-family="Georgia,serif" font-size="12" fill="#9A9A9A"
