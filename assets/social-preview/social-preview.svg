<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="铁板神数软件 Tieban Shenshu Community Edition">
  <title>铁板神数软件 · Tieban Shenshu Community Edition</title>
  <defs>
    <linearGradient id="sp-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF9F2"/>
      <stop offset="50%" stop-color="#F5EFE1"/>
      <stop offset="100%" stop-color="#EBE2CF"/>
    </linearGradient>
    <pattern id="sp-fibre" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 L9 0" stroke="#000" stroke-opacity="0.014" stroke-width="1"/>
    </pattern>
    <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8894E"/>
      <stop offset="50%" stop-color="#CFAE68"/>
      <stop offset="100%" stop-color="#A8894E"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-paper)"/>
  <rect width="1280" height="640" fill="url(#sp-fibre)"/>

  <!-- 宋版外框 -->
  <rect x="34" y="34" width="1212" height="572" fill="none" stroke="#1B1B1B" stroke-width="4"/>
  <rect x="48" y="48" width="1184" height="544" fill="none" stroke="#1B1B1B" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="72" y="72" width="1136" height="496" fill="none" stroke="url(#sp-gold)" stroke-width="1.4" stroke-opacity="0.8"/>

  <!-- 版心竖线 -->
  <line x1="330" y1="96" x2="330" y2="544" stroke="#1B1B1B" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="352" y1="96" x2="352" y2="544" stroke="#1B1B1B" stroke-opacity="0.2" stroke-width="1"/>

  <!-- 左：竖排品牌 -->
  <g font-family="'Songti SC','SimSun','Noto Serif SC','Source Han Serif SC',serif" fill="#8C2B22" text-anchor="middle">
    <text x="198" y="182" font-size="46" letter-spacing="4">铁板</text>
    <text x="198" y="248" font-size="46" letter-spacing="4">神数</text>
    <text x="198" y="314" font-size="46" letter-spacing="4">软件</text>
  </g>
  <text x="198" y="392" font-family="'Songti SC','SimSun',serif" font-size="18" fill="#5B5B5B" text-anchor="middle" letter-spacing="2">公開學術版</text>

  <!-- 主标题 -->
  <text x="410" y="192" font-family="'Songti SC','SimSun','Noto Serif SC','Source Han Serif SC',serif"
        font-size="88" font-weight="700" fill="#141414" letter-spacing="6">铁板神数软件</text>

  <!-- 英文 -->
  <text x="414" y="256" font-family="Georgia,'Times New Roman',serif"
        font-size="27" fill="#A8894E" letter-spacing="10">TIEBAN SHENSHU</text>

  <line x1="414" y1="290" x2="900" y2="290" stroke="url(#sp-gold)" stroke-width="2"/>

  <!-- 说明 -->
  <text x="414" y="336" font-family="'Songti SC','PingFang SC','Microsoft YaHei',sans-serif"
