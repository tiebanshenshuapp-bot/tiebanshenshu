name: 日常巡检

on:
  schedule:
    # 每天 UTC 01:17（北京/香港时间 09:17），避开整点高峰
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  health:
    name: 仓库健康巡检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: 教学工具测试
        working-directory: demo
        run: python -m unittest discover -s tests

      - name: 安全门禁
        run: python scripts/check_public_safety.py

      - name: Markdown 结构
        run: python scripts/check_markdown_structure.py

      - name: 相对链接检查
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = []
          n = 0
          for dp, ds, fs in os.walk('.'):
              ds[:] = [d for d in ds if d not in ('.git', '__pycache__', '_preview')]
              for f in fs:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(dp, f)
                  t = open(p, encoding='utf-8', errors='replace').read()
                  for m in re.finditer(r'\]\((?!https?://|#|mailto:)([^)#\s]+)', t):
                      tg = m.group(1).strip()
                      if not tg:
                          continue
                      n += 1
                      if not os.path.exists(os.path.normpath(os.path.join(dp, tg))):
                          bad.append(f'{p} -> {tg}')
          print(f'相对链接 {n} 条')
          if bad:
              print('失效:')
              for b in bad:
                  print(' ', b)
              sys.exit(1)
          print('OK 全部有效')
          PY

      - name: 外部链接健康检查
        run: |
          python3 - <<'PY'
          import re, os, sys, urllib.request, ssl
          ctx = ssl.create_default_context()
          urls = set()
          for dp, ds, fs in os.walk('.'):
              ds[:] = [d for d in ds if d not in ('.git', '__pycache__', '_preview')]
              for f in fs:
                  if not f.endswith('.md'):
                      continue
                  t = open(os.path.join(dp, f), encoding='utf-8', errors='replace').read()
                  for m in re.finditer(r'https?://[^\s\)\]\>"\'，。]+', t):
                      u = m.group().strip('.,;:*_ 。，')  # 去除 Markdown 强调符与标点
                      # 只检查我们自己的关键域名与外链
                      urls.add(u)
          critical = {u for u in urls if 'tiebanshenshuapp.com' in u}
          print(f'发现外链 {len(urls)} 条，其中官网 {len(critical)} 条')
          fail = []
          for u in sorted(critical):
              try:
                  req = urllib.request.Request(u, method='HEAD',
                          headers={'User-Agent': 'Mozilla/5.0 (compatible; tieban-ci/1.0)'})
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      print(f'  {r.status} {u}')
              except Exception as e:
                  fail.append((u, str(e)[:80]))
                  print(f'  FAIL {u} :: {str(e)[:80]}')
          if fail:
              print(f'::error::{len(fail)} 条官网链接不可达')
              sys.exit(1)
          PY

      - name: 内容完整性统计
        run: |
          echo "### 内容基线" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for lang in zh-hans zh-hk zh-tw en; do
            n=$(ls docs/$lang/*.md 2>/dev/null | wc -l)
            echo "| docs/$lang | $n 篇 |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| 四语 README | $(ls README*.md | wc -l) 个 |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | $(grep -c 'def test_' demo/tests/test_tools.py) 个 |" >> $GITHUB_STEP_SUMMARY
          echo "| 公开条文示例 | $(ls samples/authorized-excerpts/*.md 2>/dev/null | wc -l) 条 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "巡检时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M %Z')" >> $GITHUB_STEP_SUMMARY

      - name: 结论
        if: success()
        run: echo "::notice::日常巡检全部通过"