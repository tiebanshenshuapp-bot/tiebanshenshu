name: 教学工具问题 / Tool Issue
description: 报告 demo/ 教学工具的 bug 或改进建议
title: "[工具] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **提醒**：如果工具输出与某些命理软件不同，先看
        [FAQ Q11](https://github.com/tiebanshenshuapp/tiebanshenshu/blob/main/docs/zh-hans/faq.md)，
        很可能是**流派算法差异**而非 bug。

  - type: input
    id: command
    attributes:
      label: 执行的命令
      placeholder: "python tieban_open_tools.py ganzhi 1984"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期待的结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含报错信息）
      render: text
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Python 3.11.5 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
    validations:
      required: false