# GitHub Pages（Jekyll）配置 · 铁板神数公开研究知识库
title: 鐵板神數 · 公开研究知识库
description: 铁板神数（Tieban Shenshu）公开研究资料：术语索引、历史源流、研究方法与可运行教学示例。
lang: zh-Hans

url: https://tiebanshenshuapp-bot.github.io
baseurl: /tiebanshenshu

official_site: https://tiebanshenshuapp.com
trial_cta: https://tiebanshenshuapp.com/trial

plugins:
  - jekyll-sitemap
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

exclude:
  - "*.py"
  - "scripts/"
  - "demo/tests/"

defaults:
  - scope: { path: "" }
    values: { layout: default }
